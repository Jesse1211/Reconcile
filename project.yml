name: Reconcile
options:
  bundleIdPrefix: com.reconcile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  Reconcile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - target: ReconcileWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reconcile.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc sign (identity "-") so the App Group entitlement is actually EMBEDDED.
        # With CODE_SIGNING_ALLOWED: NO the entitlements file is ignored, the
        # group.com.reconcile.shared container is never provisioned, and
        # UserDefaults(suiteName:) returns nil — so the app + widget silently fall back
        # to separate .standard defaults and the widget never sees the app's snapshot.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/Reconcile.entitlements

  # T12 (ADR-041–ADR-045): the WidgetKit app-extension target. It compiles ONLY the
  # read-side shared snapshot code (AppGroup, snapshot model, store, loader) + the
  # Theme enum + its own widget views/provider. It does NOT compile the app-side
  # WidgetSnapshotWriter — the widget is READ-ONLY (ADR-042), so no write path lives
  # in the extension binary.
  ReconcileWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "*.md"
      - path: Sources/Theming/Theme.swift
      - path: Sources/WidgetShared/AppGroup.swift
      - path: Sources/WidgetShared/WidgetSnapshot.swift
      - path: Sources/WidgetShared/WidgetSnapshotStore.swift
      - path: Sources/WidgetShared/WidgetSnapshotLoader.swift
      - path: Sources/WidgetShared/WidgetLayout.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.reconcile.app.widget
        # Ad-hoc sign so the widget carries the SAME App Group entitlement as the app
        # (both must be in group.com.reconcile.shared for the snapshot round-trip).
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/ReconcileWidget.entitlements

  ReconcileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ReconcileTests
    dependencies:
      - target: Reconcile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reconcile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Reconcile:
    build:
      targets:
        Reconcile: all
        ReconcileWidgetExtension: all
        ReconcileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ReconcileTests

  ReconcileWidget:
    build:
      targets:
        ReconcileWidgetExtension: all
    run:
      config: Debug
